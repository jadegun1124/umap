name: Build Android APK (Kinnex)

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Kinnex Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK and Licenses
        run: |
          mkdir -p android
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          cat android/local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Build Web Application
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_VWORLD_API_KEY: ${{ secrets.VITE_VWORLD_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VITE_FAMILY_SYNC_URL: ${{ secrets.VITE_FAMILY_SYNC_URL != '' && secrets.VITE_FAMILY_SYNC_URL || 'https://umap-family-sync.umap-jadegun.workers.dev' }}
          VITE_KAKAO_NATIVE_APP_KEY: ${{ secrets.VITE_KAKAO_NATIVE_APP_KEY }}
          VITE_KAKAO_JAVASCRIPT_KEY: ${{ secrets.VITE_KAKAO_JAVASCRIPT_KEY }}
          VITE_NAVER_CLIENT_ID: ${{ secrets.VITE_NAVER_CLIENT_ID }}
        run: |
          if [ -z "${VITE_VWORLD_API_KEY}" ] && [ -n "${VWORLD_API_KEY}" ]; then
            export VITE_VWORLD_API_KEY="${VWORLD_API_KEY}"
          fi
          # Vite reads VITE_VWORLD_API_KEY only while this build runs and writes it into the APK assets.
          VITE_VWORLD_API_KEY="$(printf '%s' "${VITE_VWORLD_API_KEY}" | tr -d '[:space:]')"
          export VITE_VWORLD_API_KEY
          if [ -n "${VITE_VWORLD_API_KEY}" ]; then
            echo "VWorld key is present for this APK build."
          else
            echo "VWorld key is missing. The APK will show the Korean missing-key notice."
          fi
          # Public worker URL. Not a secret. An Actions secret overrides it when set.
          VITE_FAMILY_SYNC_URL="$(printf '%s' "${VITE_FAMILY_SYNC_URL}" | tr -d '[:space:]')"
          export VITE_FAMILY_SYNC_URL
          if [ "${VITE_FAMILY_SYNC_URL}" = "https://umap-family-sync.umap-jadegun.workers.dev" ]; then
            echo "Family sync URL is the public worker default."
          else
            echo "Family sync URL comes from the Actions secret."
          fi
          npm run build

      - name: Copy Web Assets into Native Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo "Assets copied to Android:"
          ls -la android/app/src/main/assets/public/

      - name: Build release APK with Gradle
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY != '' && secrets.KAKAO_NATIVE_APP_KEY || secrets.VITE_KAKAO_NATIVE_APP_KEY }}
        run: |
          cd android
          # assembleRelease uses android/app/umap-sideload.keystore, the same
          # certificate as earlier sideload APKs. SHA-1 must stay
          # 00:57:37:35:22:70:B8:4C:7F:B6:01:61:29:BD:A9:A3:CD:09:35:0C.
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/kinnex-v1.83.0.apk
          echo "Output directory contents:"
          ls -lh output/

      - name: Require the committed sideload certificate
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          "$APKSIGNER" verify --print-certs output/kinnex-v1.83.0.apk | tee output/apk-certs.txt
          python3 - <<'PY'
          import pathlib, re, subprocess
          certs = pathlib.Path("output/apk-certs.txt").read_text()
          apk = re.search(r"SHA-256 digest: ([0-9a-fA-F:]+)", certs)
          if not apk:
              raise SystemExit("APK has no SHA-256 certificate digest")
          listed = subprocess.check_output([
              "keytool", "-list", "-v",
              "-keystore", "android/app/umap-sideload.keystore",
              "-storepass", "umap-sideload",
              "-alias", "umap-sideload",
          ], text=True)
          store = re.search(r"SHA256:\s*([0-9A-Fa-f:]+)", listed)
          if not store:
              raise SystemExit("keystore has no SHA256 fingerprint")
          def norm(value):
              return value.replace(":", "").lower()
          if norm(apk.group(1)) != norm(store.group(1)):
              raise SystemExit(
                  f"APK certificate {apk.group(1)} does not match sideload keystore {store.group(1)}"
              )
          if "CN=Umap Sideload" not in certs:
              raise SystemExit("APK certificate subject is not the sideload key")
          print("Sideload certificate matches the committed keystore.")
          sha1 = re.search(r"SHA1:\s*([0-9A-Fa-f:]+)", listed)
          if not sha1:
              raise SystemExit("keystore has no SHA1 fingerprint")
          expected = "005737352270b84c7fb6016129bda9a3cd09350c"
          if norm(sha1.group(1)) != expected:
              raise SystemExit(f"keystore SHA1 {sha1.group(1)} is not the Kakao release hash")
          print(f"Release keystore SHA1={sha1.group(1)}")
          PY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinnex-v1.83.0-apk
          path: output/kinnex-v1.83.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.83.0
          name: 'Kinnex Android APK v1.83.0'
          make_latest: true
          body: |
            ### Kinnex 안드로이드 앱 1.83.0
            - 기록이 많은 폰에서 저장과 다시 읽기가 끝없이 반복되어 앱이 느려지고 기록 탭에서 응답 없음으로 꺼지던 문제를 고쳤습니다. 방문 40개, 여정 80개로 자르던 불러오기 제한을 30일 보관 규칙 하나로 맞췄고, 같은 기록 수로는 다시 읽기를 한 번만 합니다.
            - 세션 저장은 1.2초(최대 5초) 모아서 하고, 앱이 백그라운드로 가면 바로 저장합니다. 기록 목록은 화면 근처 카드만 지도를 만들고 동시에 4개까지만 띄웁니다. 나머지는 경로 그림으로 보여 줍니다.
            - 1.81.0에서 1.75.0 코드로 롤백한 위에 올린 빌드라, 1.76.0부터 1.80.0의 타일 설정과 서비스 워커 타일 캐시는 들어 있지 않습니다.
            - 앱을 업데이트해도 이동 궤적과 기록은 이 폰의 파일에 남습니다. 기록은 id로 합치고, 빈 목록이나 더 짧은 목록은 기존 여정을 지우지 않습니다. 서버에 남은 암호문은 다시 받아 합칩니다.
            - 핀은 실제 좌표에 둡니다. 50m 안의 가족은 상태창을 하나로 합치고, 장소 이름은 맨 위에 한 번, 이름과 배터리는 나를 맨 위에 두고 아래로 나열합니다. 배터리가 없으면 — 입니다. 지도 이동 중에는 창을 다시 계산하지 않습니다.
            - 런처 아이콘은 KINVO 그림이 가장자리까지 채워집니다. 삼성 홈 화면의 스쿼클 안에 작은 사각형이 남지 않습니다.
            - 가족 위치 원은 그 사람의 위도·경도에 고정됩니다. 지도를 확대하거나 옮겨도 원 중심이 지면에서 밀리지 않습니다.
            - 가족 키가 없어도 키 업로드는 60초에 한 번만 합니다. 같은 방의 요청은 겹치지 않고, 열쇠가 바뀌지 않으면 그 이벤트로 다시 올리지 않습니다. 이미 있는 기록 열쇠는 매번 새로 감싸지 않습니다.
            - 서버는 같은 동기화에서 공개 키와 이어서 올리는 감싼 열쇠를 저장한 뒤, 45초 동안 그 구성원의 키를 다시 쓰지 않습니다. 공개 키와 감싼 열쇠가 같으면 방을 다시 쓰지 않습니다.
            - 읽기 열쇠가 없는 가족 위치는 30초마다 받습니다. 아직 구성원이 아니면 키를 한 번 올려 등록합니다. 프로필 키가 거절되면 키를 다시 맞춘 뒤 잠시 뒤에 다시 받습니다. 읽기 열쇠가 틀리거나 제외된 구성원은 로그인할 때까지 그 방 조회를 멈춥니다.
            - 위치 시각이 45초를 넘으면 핀과 카드에 N분 전, N시간 전을 붙입니다. 3분이 넘으면 핀을 흐리게 하고, 10분이 넘으면 마지막 위치로 표시합니다.
            - GPS가 90초 동안 없으면 마지막 핀을 새 시각으로 다시 올리지 않습니다. 알림 조회가 403이면 5초부터 10분까지 늦추고, 성공하면 알림 커서를 최근으로 옮깁니다.
            - 요청에 X-App-Version 헤더를 넣습니다. 읽기 열쇠만 있는 예전 알림 조회는 구성원 헤더가 없어도 방을 읽습니다.
            - 방 조회는 10초, 대화 목록은 60초, 열린 대화는 5초, 상태 확인은 120초입니다.
            - 앱을 닫아도 위치 유지가 이어집니다. 걸음은 2초, 차와 자전거는 1초, 머무름은 20초마다 받습니다. GPS가 이동 중 15초, 머무름 중 90초 동안 없으면 다시 등록합니다. 2분마다 알람으로 서비스를 살리고, 15분마다 WorkManager가 한 번 더 확인합니다.
            - 가족 업로드는 이동 중 30초, 머무름 중 60초이고, 머무름과 이동이 바뀌면 바로 보냅니다.
            - 하루 종일 움직이면 폰 하나당 약 2,880회, 네 명이 같이 움직이면 약 11,520회입니다. 8시간 이동과 16시간 머무름이면 폰 하나당 1,920회, 네 명이면 7,680회입니다. 무료 한도 10만 회보다 적습니다.
            - 카카오가 다른 계정에 연결되어 있으면 기존 가족 방을 이 계정으로 가져올지 묻습니다. 가져오면 카카오 로그인은 이 계정으로만 됩니다. 암호화된 지난 기록은 가족 폰이 열쇠를 다시 감싸기 전에는 열리지 않습니다.
            - 걸음은 5분, 차와 자전거는 12분 넘게 머물면 그 이동은 기록으로 넘어가고 진행 중 지도에서는 빠집니다. 진행 중 이동 안의 먼 점은 실선으로 이어집니다.
            - 그룹장이 가족 초대 링크를 보내면 받는 사람이 구성원 전체를 함께 봅니다. 방 열쇠는 주소의 # 뒤에만 있습니다.
            - 초대 링크의 첫 버튼은 카카오톡으로 보내기입니다. 카카오톡이 없으면 다른 앱 공유로 넘어가고, 링크 복사는 그대로 있습니다.
            - 지도를 보고 있는 동안 고른 사람을 따라갑니다. 지도를 옮기면 멈추고, 내 위치로를 누르면 다시 따라갑니다.
            - 위치 서버가 503이면 재시도는 5초, 15초, 45초, 2분, 그다음 10분까지 늘어납니다. 성공하면 다시 이동 30초, 머무름 60초입니다.
            - 설정에 앱 업데이트 버튼이 있습니다. 예: 앱 버전 1.83.0 (89).
            - 회사 홈 (GitHub Pages): https://jadegun1124.github.io/kinnex/
            - 이 파일: GitHub Releases APK. Google Play에는 없습니다.
            - 다운로드: https://github.com/jadegun1124/umap/releases/download/v1.83.0/kinnex-v1.83.0.apk
            - 표시 이름: Kinnex
            - 패키지: `kr.co.umap.tracker`
            - versionName: 1.83.0
            - versionCode: 89
          files: output/kinnex-v1.83.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
