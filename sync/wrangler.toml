name = "umap-family-sync"
main = "worker.mjs"
compatibility_date = "2026-01-15"
workers_dev = true

[[durable_objects.bindings]]
name = "FAMILY_ROOM"
class_name = "FamilyRoom"

[[durable_objects.bindings]]
name = "FAMILY_ACCOUNT"
class_name = "FamilyAccount"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FamilyRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FamilyAccount"]

# Public Naver client id. NAVER_CLIENT_SECRET and DIAG_READ_TOKEN are Worker secrets
# and are not in this file. DIAG_READ_TOKEN only unlocks GET /v1/diag/recent.
[vars]
NAVER_CLIENT_ID = "dQCiRLIzbNkDG6ULiroD"

# Daily sweep drops disclosure rows whose six-month window has ended.
# 16:00 UTC is 01:00 in Korea. Account requests also run the same sweep.
[triggers]
crons = ["0 16 * * *"]

# Head sampling is chosen when the request starts. Workers Logs has no
# separate rate that keeps every error while sampling successful requests.
# At 0.1, about 90% of error invocations are also dropped.
# `npx wrangler deploy` reads this file. A scripts API multipart upload does
# not: put the same observability object in the upload metadata, including
# logs.head_sampling_rate 0.1. There is no second metadata file in this repo.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Workers Issues groups failures. Wrangler 4.134.0 or later.
[observability.issues]
enabled = true
